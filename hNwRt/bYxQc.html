```html
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vibe</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    border-bottom: 1px solid #292929;
    background: #0f0f0f;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    margin-right: 35px;
    white-space: nowrap;
}

.search {
    display: flex;
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.search input {
    flex: 1;
    background: #191919;
    border: 1px solid #444;
    color: white;
    padding: 14px 18px;
    font-size: 16px;
    border-radius: 25px 0 0 25px;
    outline: none;
}

.search button {
    width: 70px;
    border: 1px solid #444;
    background: #292929;
    color: white;
    border-radius: 0 25px 25px 0;
    cursor: pointer;
    font-size: 20px;
}

.search button:hover {
    background: #383838;
}

.settings-button {
    margin-left: 15px;
    background: #292929;
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 18px;
}

.settings-button:hover {
    background: #383838;
}

main {
    padding: 30px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px 18px;
    max-width: 1500px;
    margin: auto;
}

.card {
    color: white;
    text-decoration: none;
    cursor: pointer;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    background: #222;
}

.title {
    font-size: 16px;
    font-weight: bold;
    margin-top: 11px;
    line-height: 1.3;
}

.channel {
    color: #999;
    font-size: 14px;
    margin-top: 7px;
}

.watch {
    max-width: 1100px;
    margin: auto;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 12px;
    overflow: hidden;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.empty {
    text-align: center;
    color: #888;
    margin-top: 100px;
    font-size: 18px;
}

.load-area {
    text-align: center;
    margin: 45px 0 20px;
}

.load-button {
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    background: #292929;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.load-button:hover {
    background: #383838;
}

.load-button:disabled {
    opacity: 0.5;
    cursor: wait;
}

.settings-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.settings-box {
    width: 90%;
    max-width: 400px;
    background: #191919;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 25px;
}

.settings-box h2 {
    margin-top: 0;
}

.settings-box label {
    display: block;
    margin-bottom: 8px;
    color: #aaa;
}

.settings-box input {
    width: 100%;
    padding: 12px;
    background: #0f0f0f;
    border: 1px solid #444;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    outline: none;
}

.settings-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.settings-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #292929;
    color: white;
    cursor: pointer;
}

@media (max-width: 700px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 22px;
        margin-right: 15px;
    }

    main {
        padding: 15px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
Vibe
</div>

<form class="search" id="searchForm">

<input
    id="searchInput"
    type="text"
    placeholder="Search videos..."
    autocomplete="off"
>

<button type="submit">
⌕
</button>

</form>

<button
    id="settingsButton"
    class="settings-button"
    title="Settings"
>
⚙
</button>

</header>

<main>

{% if watch_id %}

<div class="watch">

<div class="player">

<iframe
    src="https://www.youtube.com/embed/{{ watch_id }}"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

</div>

</div>

{% else %}

<div
    id="results"
    class="grid">
</div>

<div
    id="emptyMessage"
    class="empty"
>

<button
    id="loadButton"
    class="load-button"
>
Load Something to Watch
</button>

</div>

<div
    id="loadArea"
    class="load-area"
    style="display:none;"
>

<button
    id="moreButton"
    class="load-button"
>
Load More Results
</button>

</div>

{% endif %}

</main>

<div
    id="settingsPanel"
    class="settings-panel"
>

<div class="settings-box">

<h2>Settings</h2>

<label for="tabName">
Browser Tab Name
</label>

<input
    id="tabName"
    type="text"
    maxlength="40"
    placeholder="Vibe"
>

<div class="settings-buttons">

<button id="saveTabName">
Save
</button>

<button id="closeSettings">
Cancel
</button>

</div>

</div>

</div>

<script>

const results = document.getElementById("results");

const emptyMessage = document.getElementById("emptyMessage");

const loadButton = document.getElementById("loadButton");

const loadArea = document.getElementById("loadArea");

const moreButton = document.getElementById("moreButton");

const searchForm = document.getElementById("searchForm");

const searchInput = document.getElementById("searchInput");

const settingsButton = document.getElementById("settingsButton");

const settingsPanel = document.getElementById("settingsPanel");

const tabNameInput = document.getElementById("tabName");

const saveTabName = document.getElementById("saveTabName");

const closeSettings = document.getElementById("closeSettings");


let seenVideos = new Set();

let currentQuery = "";

let nextPage = "";

let loading = false;

let recommendationMode = false;


function addVideos(videos) {

    if (!videos || videos.length === 0) {
        return;
    }

    for (const video of videos) {

        if (!video.id) {
            continue;
        }

        if (seenVideos.has(video.id)) {
            continue;
        }

        seenVideos.add(video.id);


        const card = document.createElement("a");

        card.className = "card";

        card.href = "/view/" + video.id;


        const image = document.createElement("img");

        image.className = "thumbnail";

        image.src = video.thumbnail;

        image.alt = "";

        image.loading = "lazy";


        const title = document.createElement("div");

        title.className = "title";

        title.textContent = video.title;


        const channel = document.createElement("div");

        channel.className = "channel";

        channel.textContent = video.channel;


        card.appendChild(image);

        card.appendChild(title);

        card.appendChild(channel);

        results.appendChild(card);

    }

}


async function loadRecommendations() {

    if (loading) {
        return;
    }

    loading = true;

    recommendationMode = true;


    if (loadButton) {

        loadButton.disabled = true;

        loadButton.textContent = "Loading...";

    }

    if (moreButton) {

        moreButton.disabled = true;

        moreButton.textContent = "Loading...";

    }


    const seen = Array.from(seenVideos).join(",");


    try {

        const response = await fetch(
            "/recommendations?seen=" +
            encodeURIComponent(seen) +
            "&count=24"
        );


        if (!response.ok) {
            throw new Error("Recommendation request failed");
        }


        const data = await response.json();


        const before = seenVideos.size;

        addVideos(data.videos);

        const added = seenVideos.size - before;


        if (added > 0) {

            if (emptyMessage) {
                emptyMessage.style.display = "none";
            }

            if (loadArea) {
                loadArea.style.display = "block";
            }

        }


        if (loadButton) {

            loadButton.style.display = "none";

        }


    } catch (error) {

        if (loadButton) {

            loadButton.disabled = false;

            loadButton.textContent = "Try Again";

        }

    }


    loading = false;


    if (moreButton) {

        moreButton.disabled = false;

        moreButton.textContent = "Load More Results";

    }

}


async function searchVideos(query, pageToken = "") {

    if (loading) {
        return;
    }

    loading = true;

    currentQuery = query;

    recommendationMode = false;


    if (moreButton) {

        moreButton.disabled = true;

        moreButton.textContent = "Loading...";

    }


    let url =
        "/search?q=" +
        encodeURIComponent(query);


    if (pageToken) {

        url +=
            "&page=" +
            encodeURIComponent(pageToken);

    }


    try {

        const response = await fetch(url);


        if (!response.ok) {
            throw new Error("Search request failed");
        }


        const data = await response.json();


        addVideos(data.videos);


        nextPage = data.next_page || "";


        if (emptyMessage) {
            emptyMessage.style.display = "none";
        }


        if (loadButton) {
            loadButton.style.display = "none";
        }


        if (nextPage) {

            loadArea.style.display = "block";

            moreButton.disabled = false;

            moreButton.textContent =
                "Load More Results";

        } else {

            loadArea.style.display = "none";

        }


    } catch (error) {

        moreButton.disabled = false;

        moreButton.textContent = "Try Again";

    }


    loading = false;

}


if (loadButton) {

    loadButton.addEventListener(
        "click",
        function() {

            currentQuery = "";

            nextPage = "";

            loadRecommendations();

        }
    );

}


if (moreButton) {

    moreButton.addEventListener(
        "click",
        async function() {

            if (loading) {
                return;
            }


            if (currentQuery) {

                if (!nextPage) {
                    return;
                }


                const pageToLoad = nextPage;

                await searchVideos(
                    currentQuery,
                    pageToLoad
                );


            } else {

                await loadRecommendations();

            }

        }
    );

}


searchForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const query =
            searchInput.value.trim();


        if (!query) {
            return;
        }


        seenVideos.clear();

        results.innerHTML = "";


        currentQuery = query;

        nextPage = "";

        recommendationMode = false;


        if (emptyMessage) {
            emptyMessage.style.display = "none";
        }


        if (loadArea) {
            loadArea.style.display = "block";
        }


        if (moreButton) {

            moreButton.disabled = true;

            moreButton.textContent = "Loading...";

        }


        searchVideos(query);

    }
);


const savedTabName =
    localStorage.getItem("vibeTabName");


if (savedTabName) {

    document.title = savedTabName;

    tabNameInput.value = savedTabName;

}


settingsButton.addEventListener(
    "click",
    function() {

        settingsPanel.style.display = "flex";

    }
);


closeSettings.addEventListener(
    "click",
    function() {

        settingsPanel.style.display = "none";

    }
);


saveTabName.addEventListener(
    "click",
    function() {

        let name =
            tabNameInput.value.trim();


        if (!name) {
            name = "Vibe";
        }


        localStorage.setItem(
            "vibeTabName",
            name
        );


        document.title = name;


        settingsPanel.style.display = "none";

    }
);


settingsPanel.addEventListener(
    "click",
    function(event) {

        if (event.target === settingsPanel) {

            settingsPanel.style.display = "none";

        }

    }
);

</script>

</body>

</html>
```
