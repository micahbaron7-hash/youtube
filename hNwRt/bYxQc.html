<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vibe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            border-bottom: 1px solid #292929;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-right: 35px;
        }

        .search {
            display: flex;
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .search input {
            flex: 1;
            background: #191919;
            border: 1px solid #444;
            color: white;
            padding: 14px 18px;
            font-size: 16px;
            border-radius: 25px 0 0 25px;
            outline: none;
        }

        .search button {
            width: 70px;
            border: 1px solid #444;
            background: #292929;
            color: white;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
            font-size: 20px;
        }

        .search button:hover {
            background: #383838;
        }

        main {
            padding: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px 18px;
            max-width: 1500px;
            margin: auto;
        }

        .card {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            background: #222;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 11px;
            line-height: 1.3;
        }

        .channel {
            color: #999;
            font-size: 14px;
            margin-top: 7px;
        }

        .watch {
            max-width: 1100px;
            margin: auto;
        }

        .player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        .player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty {
            text-align: center;
            color: #888;
            margin-top: 100px;
            font-size: 18px;
        }

        .load-area {
            text-align: center;
            margin: 45px 0 20px;
        }

        .load-button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #292929;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .load-button:hover {
            background: #383838;
        }

        .load-button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        @media (max-width: 700px) {
            header {
                padding: 0 12px;
            }

            .logo {
                font-size: 22px;
                margin-right: 15px;
            }

            main {
                padding: 15px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">Vibe</div>

    <form class="search" id="searchForm">

        <input
            id="searchInput"
            type="text"
            name="q"
            placeholder="Search videos..."
            value="{{ query }}"
            autocomplete="off"
        >

        <button type="submit">⌕</button>

    </form>

</header>

<main>

{% if watch_id %}

    <div class="watch">

        <div class="player">

            <iframe
                src="https://www.youtube.com/embed/{{ watch_id }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    </div>

{% else %}

    <div id="results" class="grid"></div>

    <div id="emptyMessage" class="empty">
        <button
            id="loadButton"
            class="load-button">
            Load Something to Watch
        </button>
    </div>

    <div id="loadArea" class="load-area" style="display:none;">

        <button
            id="moreButton"
            class="load-button">
            Load More Results
        </button>

    </div>

{% endif %}

</main>

<script>
const results = document.getElementById("results");
const emptyMessage = document.getElementById("emptyMessage");
const loadButton = document.getElementById("loadButton");
const loadArea = document.getElementById("loadArea");
const moreButton = document.getElementById("moreButton");
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");

let seenVideos = new Set();
let currentQuery = "";
let nextPage = "";
let loading = false;

function addVideos(videos) {
    for (const video of videos) {

        if (seenVideos.has(video.id)) {
            continue;
        }

        seenVideos.add(video.id);

        const card = document.createElement("a");

        card.className = "card";
        card.href = "/view/" + video.id;

        const image = document.createElement("img");

        image.className = "thumbnail";
        image.src = video.thumbnail;
        image.alt = "";

        const title = document.createElement("div");

        title.className = "title";
        title.textContent = video.title;

        const channel = document.createElement("div");

        channel.className = "channel";
        channel.textContent = video.channel;

        card.appendChild(image);
        card.appendChild(title);
        card.appendChild(channel);

        results.appendChild(card);
    }
}

async function loadRecommendations() {

    if (loading) {
        return;
    }

    loading = true;

    loadButton.disabled = true;
    loadButton.textContent = "Loading...";

    const seen = Array.from(seenVideos).join(",");

    try {

        const response = await fetch(
            "/recommendations?seen=" + encodeURIComponent(seen)
        );

        const data = await response.json();

        addVideos(data.videos);

        if (data.videos.length > 0) {
            emptyMessage.style.display = "none";
            loadArea.style.display = "block";
        } else {
            loadButton.textContent = "No videos found";
        }

    } catch (error) {

        loadButton.disabled = false;
        loadButton.textContent = "Try Again";
    }

    loading = false;

    if (seenVideos.size > 0) {
        moreButton.disabled = false;
        moreButton.textContent = "Load More Results";
    }
}

async function searchVideos(query, pageToken = "") {

    if (loading) {
        return;
    }

    loading = true;

    moreButton.disabled = true;
    moreButton.textContent = "Loading...";

    let url =
        "/search?q=" +
        encodeURIComponent(query);

    if (pageToken) {
        url += "&page=" + encodeURIComponent(pageToken);
    }

    try {

        const response = await fetch(url);

        const data = await response.json();

        addVideos(data.videos);

        nextPage = data.next_page || "";

        emptyMessage.style.display = "none";

        if (nextPage) {
            loadArea.style.display = "block";
            moreButton.textContent = "Load More Results";
            moreButton.disabled = false;
        } else {
            loadArea.style.display = "none";
        }

    } catch (error) {

        moreButton.textContent = "Try Again";
        moreButton.disabled = false;
    }

    loading = false;
}

loadButton.addEventListener("click", function() {

    loadRecommendations();

});

moreButton.addEventListener("click", function() {

    if (currentQuery) {

        if (nextPage) {
            searchVideos(currentQuery, nextPage);
        }

    } else {

        loadRecommendations();

    }

});

searchForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const query = searchInput.value.trim();

    if (!query) {
        return;
    }

    currentQuery = query;
    nextPage = "";
    seenVideos.clear();

    results.innerHTML = "";

    emptyMessage.style.display = "none";

    loadArea.style.display = "block";

    moreButton.disabled = true;
    moreButton.textContent = "Loading...";

    searchVideos(query);

});

</script>

</body>
</html>
